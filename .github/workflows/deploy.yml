name: Deploy to MonsterASP.NET

on:
  push:
    branches:
      - main # Change to 'master' if your main branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup .NET SDK
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Restore dependencies & build project
    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Application
      run: dotnet build --configuration Release --no-restore

    # 4. Publish application binaries to output directory
    - name: Publish Application
      run: dotnet publish --configuration Release --output ./publish --no-build

    # 5. Prepare app_offline in a separate directory (NOT inside ./publish/)
    - name: Prepare app_offline.htm
      run: |
        mkdir -p ./offline_temp
        echo "<html><body><h2>Site Under Maintenance</h2></body></html>" > ./offline_temp/app_offline.htm

    # 6. Upload ONLY app_offline.htm first to shut down IIS app domain
    - name: Upload app_offline.htm
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./offline_temp/
        server-dir: /wwwroot/
        protocol: ftps
        port: 21

    # 7. Pause to let IIS complete shutdown and release all DLL file handles
    - name: Wait for IIS App Domain Shutdown
      run: sleep 10

    # 8. Deploy main application files (excluding app_offline.htm)
    - name: FTP Deploy Application to MonsterASP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /wwwroot/
        protocol: ftps
        port: 21

    # 9. Delete app_offline.htm to bring site back online
    - name: Remove app_offline.htm
      run: |
        curl --ftp-ssl --insecure -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -Q "-DELE /wwwroot/app_offline.htm" "ftps://${{ secrets.FTP_SERVER }}:21/" || true
